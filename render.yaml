# Render 部署設定
# 文件：https://render.com/docs/blueprint-spec
#
# 單一 Web Service：Express 後端同時服務 Vue 前端靜態檔案
# 這樣只需要一個服務，和 airbnb-clone 的做法相同
#
# 首次部署步驟：
# 1. 在 Render Dashboard 建立 New Web Service，選這個 repo
# 2. Root Directory: backend
# 3. 填入所有環境變數後部署

services:
  - type: web
    name: vue-bookstore
    runtime: node
    rootDir: backend
    buildCommand: cd ../frontend && npm install --include=dev && npm run build && cd ../backend && npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      # 以下須在 Render Dashboard 手動填入
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
